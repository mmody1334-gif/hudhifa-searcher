<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باحث حذيفة بن محصن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<!-- إضافة FontAwesome لبعض الأيقونات الإضافية إذا لزم الأمر -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f4f2ea;--card:#fff;--ink:#1c2826;--mute:#667370;--acc:#0e6b6b;--gold:#b8860b;--soft:#e4f1ef;--line:#e3e0d3;--mk:#fff1b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--card:#18221f;--ink:#e7efec;--mute:#93a39f;--acc:#4fc1b8;--gold:#e0b44a;--soft:#1d302d;--line:#2a3a36;--mk:#5a4a12}}
:root[data-theme="dark"]{--bg:#0f1816;--card:#18221f;--ink:#e7efec;--mute:#93a39f;--acc:#4fc1b8;--gold:#e0b44a;--soft:#1d302d;--line:#2a3a36;--mk:#5a4a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;line-height:1.8}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 50px}
.hero{background:#fff;color:#1c2826;border-radius:20px;box-shadow:0 6px 28px rgba(14,107,107,.12);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:4px solid #b8860b}
.lg{height:clamp(40px,11vw,96px);width:auto;flex:none}
.mid{text-align:center;flex:1;min-width:0}
.t1{font-weight:800;font-size:clamp(1.5rem,6vw,3rem);color:#0e6b6b;line-height:1.15}
.t2{font-weight:800;font-size:clamp(1.05rem,4.2vw,2.1rem);line-height:1.3;background:linear-gradient(180deg,#d4a017,#9a6a06);-webkit-background-clip:text;background-clip:text;color:transparent}
.sup{font-size:clamp(.68rem,2.4vw,.92rem);color:#667370;margin-top:2px}
.s .hero{padding:8px 14px}.s .lg{height:clamp(28px,7vw,50px)}.s .t1{font-size:clamp(1.1rem,4vw,1.6rem)}.s .t2{font-size:clamp(.85rem,3vw,1.15rem)}.s .sup{display:none}
.home{text-align:center;padding:34px 0 8px}.s .home{padding:14px 0 0}
.home p{color:var(--mute);margin:0 0 18px}.s .home p{display:none}
.sb{position:relative}
.bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 8px 5px 18px;box-shadow:0 3px 18px rgba(0,0,0,.06)}
.bar:focus-within{border-color:var(--acc);box-shadow:0 4px 22px rgba(14,107,107,.2)}
.bar svg{width:22px;height:22px;stroke:var(--mute);fill:none;stroke-width:2;flex:none}
#q, #aq{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:1.08rem;padding:10px 8px;outline:none}
button{font:inherit;cursor:pointer}
#go{border:0;border-radius:99px;background:var(--acc);color:#fff;font-weight:600;padding:9px 26px}
#as{border:0;border-radius:99px;background:var(--acc);color:#fff;font-weight:600;padding:9px 26px}#as:disabled{opacity:.5}
#clr{border:0;background:none;color:var(--mute);font-size:1.3rem;display:none}
#sug{position:absolute;inset-inline:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:5;overflow:hidden;display:none;text-align:right}
#sug div{padding:9px 20px;cursor:pointer}#sug div:hover,#sug .on{background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 14px;border-radius:99px;font-size:.9rem}
.chip:hover{border-color:var(--acc);background:var(--soft)}
.s .chips.h{display:none}
#res{margin-top:16px}
.nav{display:flex;gap:6px;justify-content:center;margin:16px 0 2px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 24px;border-radius:99px;font-weight:600}
.nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.msgs{display:flex;flex-direction:column;gap:12px;margin-top:14px;padding-bottom:10px}
.m{border-radius:18px;padding:10px 16px;overflow-wrap:anywhere}
.m.u{background:var(--acc);color:#fff;align-self:flex-start;max-width:88%}
.m.a{background:var(--card);border:1px solid var(--line);align-self:stretch; box-shadow:0 4px 15px rgba(0,0,0,0.05);}
.who{font-size:.8rem;font-weight:600;color:var(--gold)}
.m p{margin:.3em 0}.m ul,.m ol{margin:.3em 0;padding-inline-start:1.3em}.m h4{margin:.6em 0 .2em;color:var(--acc)}
.tw{overflow-x:auto;margin:.5em 0}.m table{border-collapse:collapse;font-size:.88rem;min-width:100%}.m th,.m td{border:1px solid var(--line);padding:5px 10px;text-align:right;white-space:nowrap}.m th{background:var(--soft)}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;border-radius:99px;font-size:.85rem;text-align:right}
.qchip:hover{border-color:var(--acc);background:var(--soft)}
.ib{position:sticky;bottom:0;background:var(--bg);padding:8px 0 6px}
.tools{text-align:center;margin-top:6px}.tools button{border:0;background:none;color:var(--mute);font-size:.82rem}

body{background-image:radial-gradient(circle at 8% 0%,rgba(14,107,107,.12),transparent 42%),radial-gradient(circle at 96% 8%,rgba(184,134,11,.14),transparent 40%);background-repeat:no-repeat}
.hero{animation:up .7s ease both}.home>*{animation:up .8s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.home{position:relative}.home>*:not(.doodles){position:relative;z-index:1}
.doodles{position:absolute;inset:-10px -14px 0;overflow:hidden;z-index:0;pointer-events:none}
.dd{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);color:var(--c);opacity:.26;transform:rotate(var(--r));animation:fl 7s ease-in-out infinite;animation-delay:var(--d)}
.dd use{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes fl{50%{transform:translateY(-9px) rotate(calc(var(--r) + 6deg))}}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 3px 14px rgba(0,0,0,.05)}
.facts b{display:block;font-size:1.35rem;color:var(--acc);line-height:1.3}.facts span{font-size:.8rem;color:var(--mute)}
.s .doodles,.s .facts{display:none}
@media(max-width:520px){.facts{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.dd,.hero,.home>*{animation:none}}
.spinner { animation: spin 1s linear infinite; display: inline-block;}
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="hero">
    <img class="lg" src="https://upload.wikimedia.org/wikipedia/ar/thumb/9/91/Oman_Ministry_of_Education_Logo.svg/512px-Oman_Ministry_of_Education_Logo.svg.png" alt="وزارة التعليم">
    <div class="mid">
      <div class="t1">باحث حذيفة بن محصن</div>
      <div class="t2">محرك بحث المدرسة</div>
      <div class="sup">
        <div>مدرسة حذيفة بن محصن للتعليم الأساسي (5-12)</div>
        <div>تحت إشراف د. بدر بن عبد الله الكعبي</div>
      </div>
    </div>
    <img class="lg" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Oman_Vision_2040_Logo.svg/512px-Oman_Vision_2040_Logo.svg.png" alt="رؤية عُمان 2040">
  </header>

  <nav class="nav" id="nav">
      <button class="on" data-m="ask">💬 اسأل الباحث</button>
  </nav>

  <div id="ps">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="d-pencil" viewBox="0 0 48 48"><path d="M8 40l2-8L32 10l6 6L16 38z M28 14l6 6 M8 40l8-2"/></symbol>
<symbol id="d-book" viewBox="0 0 48 48"><path d="M6 10h14a4 4 0 014 4v24a3 3 0 00-3-3H6z M42 10H28a4 4 0 00-4 4v24a3 3 0 013-3h15z"/></symbol>
<symbol id="d-cap" viewBox="0 0 48 48"><path d="M2 18L24 8l22 10-22 10z M12 23v10c0 3 6 6 12 6s12-3 12-6V23 M46 18v12"/></symbol>
<symbol id="d-bulb" viewBox="0 0 48 48"><path d="M24 6a12 12 0 00-6 22v5h12v-5a12 12 0 00-6-22z M19 38h10 M20 43h8"/></symbol>
<symbol id="d-atom" viewBox="0 0 48 48"><ellipse cx="24" cy="24" rx="20" ry="8"/><ellipse cx="24" cy="24" rx="20" ry="8" transform="rotate(60 24 24)"/><ellipse cx="24" cy="24" rx="20" ry="8" transform="rotate(120 24 24)"/><circle cx="24" cy="24" r="2.5"/></symbol>
<symbol id="d-ruler" viewBox="0 0 48 48"><path d="M4 30L30 4l14 14L18 44z M14 26l4 4 M20 20l4 4 M26 14l4 4"/></symbol>
<symbol id="d-star" viewBox="0 0 48 48"><path d="M24 5l5.5 12 13 1.5-9.7 8.8 2.7 12.9L24 33l-11.5 7.2 2.7-12.9-9.7-8.8 13-1.5z"/></symbol>
<symbol id="d-globe" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/><path d="M6 24h36 M24 6c-8 9-8 27 0 36 M24 6c8 9 8 27 0 36"/></symbol>
<symbol id="d-school" viewBox="0 0 48 48"><path d="M4 42h40 M8 42V20l16-10 16 10v22 M20 42V30h8v12 M24 10V4h6"/></symbol>
<symbol id="d-calc" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3"/><rect x="15" y="9" width="18" height="8"/><path d="M16 24h2M23 24h2M30 24h2M16 31h2M23 31h2M30 31h2M16 38h2M23 38h2M30 38h2"/></symbol>
<symbol id="d-palm" viewBox="0 0 48 48"><path d="M24 44V22 M24 22c-4-8-12-8-16-6 M24 22c4-8 12-8 16-6 M24 22c-2-9-8-13-14-12 M24 22c2-9 8-13 14-12 M24 22V8"/></symbol>
<symbol id="d-flask" viewBox="0 0 48 48"><path d="M18 4h12 M20 4v14L8 40a3 3 0 003 4h26a3 3 0 003-4L28 18V4 M14 32h20"/></symbol>
</defs></svg>
  <section class="home">
    <div class="doodles"><svg class="dd" style="--x:3%;--y:8%;--s:46px;--r:-18deg;--c:var(--acc);--d:-0s"><use href="#d-pencil"/></svg><svg class="dd" style="--x:14%;--y:62%;--s:52px;--r:10deg;--c:var(--gold);--d:-1s"><use href="#d-book"/></svg><svg class="dd" style="--x:84%;--y:6%;--s:56px;--r:8deg;--c:var(--acc);--d:-2s"><use href="#d-cap"/></svg><svg class="dd" style="--x:93%;--y:48%;--s:44px;--r:12deg;--c:var(--gold);--d:-0.5s"><use href="#d-bulb"/></svg><svg class="dd" style="--x:2%;--y:70%;--s:50px;--r:-10deg;--c:var(--gold);--d:-3s"><use href="#d-atom"/></svg><svg class="dd" style="--x:88%;--y:76%;--s:50px;--r:24deg;--c:var(--acc);--d:-1.5s"><use href="#d-ruler"/></svg><svg class="dd" style="--x:22%;--y:4%;--s:30px;--r:15deg;--c:var(--gold);--d:-2.5s"><use href="#d-star"/></svg><svg class="dd" style="--x:70%;--y:3%;--s:42px;--r:0deg;--c:var(--acc);--d:-0.8s"><use href="#d-globe"/></svg><svg class="dd" style="--x:46%;--y:84%;--s:48px;--r:0deg;--c:var(--gold);--d:-2s"><use href="#d-school"/></svg><svg class="dd" style="--x:72%;--y:82%;--s:40px;--r:-14deg;--c:var(--acc);--d:-3.2s"><use href="#d-calc"/></svg><svg class="dd" style="--x:30%;--y:86%;--s:46px;--r:6deg;--c:var(--acc);--d:-1.2s"><use href="#d-palm"/></svg><svg class="dd" style="--x:57%;--y:6%;--s:40px;--r:16deg;--c:var(--gold);--d:-2.2s"><use href="#d-flask"/></svg></div>
    
    <div class="facts"><div><b>139</b><span>طالباً</span></div><div><b>19</b><span>معلماً</span></div><div><b>5–12</b><span>الصفوف</span></div><div><b>7125</b><span>رمز المدرسة</span></div></div>
  </section>
  <div id="res"></div>
  </div>

  <section id="pa">
    <div class="msgs" id="msgs"></div>
    <div class="ib"><div class="bar"><input id="aq" placeholder="اسأل عن نسب أو أسماء أو أي تفصيلة في التقرير…" autocomplete="off" enterkeyhint="send"><button id="as" onclick="ask()">إرسال</button></div>
    <div class="tools"><button id="ar" onclick="resetChat()">محادثة جديدة ↺</button></div></div>
  </section>
</div>

<script>
    const EX = ['مين مدرس الأحياء؟', 'كم عدد الطلاب؟', 'ما هي نسبة النجاح في الإنجليزي عاشر؟', 'ما هي مشروعات المدرسة؟'];
    let busy = false;

    function addMsg(type, htmlContent) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'm ' + type;
        msgDiv.innerHTML = htmlContent;
        document.getElementById('msgs').appendChild(msgDiv);
        msgDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return msgDiv;
    }

    function resetChat() {
        document.getElementById('msgs').innerHTML = '';
        addMsg('a', `<div class="who">✨ باحث حذيفة</div><p>أهلاً بك! أنا المساعد الذكي لمدرسة حذيفة بن محصن. اسألني أي سؤال عن تقرير التقويم الذاتي وسأجيبك بدقة.</p>
        <div class="qs">${EX.map(q => `<button class="qchip" onclick="document.getElementById('aq').value='${q}';ask()">${q}</button>`).join('')}</div>`);
        document.body.classList.remove('s');
        document.getElementById('aq').value = '';
    }

    document.getElementById('aq').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            ask();
        }
    });

    async function ask() {
        const input = document.getElementById('aq');
        let q = input.value.trim();
        if (!q || busy) return;

        input.value = '';
        busy = true;
        document.getElementById('as').disabled = true;
        document.body.classList.add('s'); // تفعيل وضع الشاشة المدمجة وإخفاء الـ Doodles والحقائق

        // إضافة رسالة المستخدم
        addMsg('u', q);

        // إضافة رسالة انتظار (جاري التحليل)
        const loadingMsg = addMsg('a', '<div class="who">✨ باحث حذيفة</div><p style="color:var(--mute)"><i class="fa-solid fa-circle-notch spinner"></i> جاري البحث في التقرير...</p>');

        try {
            // الاتصال بخادم OpenAI (server.js) الخاص بك
            const response = await fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q })
            });

            const data = await response.json();

            if (data.error) {
                loadingMsg.innerHTML = `<div class="who" style="color:red;">⚠ خطأ</div><p>${data.error}</p>`;
            } else {
                // تنسيق الرد (استبدال الأسطر والخط العريض)
                let formattedAnswer = data.answer.replace(/\n/g, '<br>');
                formattedAnswer = formattedAnswer.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                
                loadingMsg.innerHTML = `<div class="who">✨ باحث حذيفة</div><p>${formattedAnswer}</p>`;
            }

        } catch (error) {
            loadingMsg.innerHTML = `<div class="who" style="color:red;">⚠ خطأ في الاتصال</div><p>تعذر الاتصال بالخادم. تأكد من أن السيرفر يعمل بشكل صحيح.</p>`;
        } finally {
            busy = false;
            document.getElementById('as').disabled = false;
            input.focus();
        }
    }

    // تهيئة المحادثة عند تحميل الصفحة
    resetChat();
</script>
</body>
</html>
