<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باحث حذيفة بن محصن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f4f2ea;--card:#fff;--ink:#1c2826;--mute:#667370;--acc:#0e6b6b;--gold:#b8860b;--soft:#e4f1ef;--line:#e3e0d3;--mk:#fff1b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--card:#18221f;--ink:#e7efec;--mute:#93a39f;--acc:#4fc1b8;--gold:#e0b44a;--soft:#1d302d;--line:#2a3a36;--mk:#5a4a12}}
:root[data-theme="dark"]{--bg:#0f1816;--card:#18221f;--ink:#e7efec;--mute:#93a39f;--acc:#4fc1b8;--gold:#e0b44a;--soft:#1d302d;--line:#2a3a36;--mk:#5a4a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;line-height:1.8; position: relative; min-height: 100vh;}

/* حاوية الدودلز في الخلفية بالكامل */
#bg-doodles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
}
.dd {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    color: var(--c);
    opacity: 0.1; /* شفافية مريحة جداً للعين */
    transform: rotate(var(--r));
    animation: fl 10s ease-in-out infinite; /* حركة بطيئة وهادئة */
    animation-delay: var(--d);
}
.dd use{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes fl{50%{transform:translateY(-8px) rotate(calc(var(--r) + 4deg))}}

.wrap{max-width:820px;margin:0 auto;padding:14px 14px 50px; position: relative; z-index: 1;}
.hero{background:#fff;color:#1c2826;border-radius:20px;box-shadow:0 6px 28px rgba(14,107,107,.12);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:4px solid #b8860b}
.lg{height:clamp(50px,12vw,80px);width:auto;flex:none; object-fit:contain;}
.mid{text-align:center;flex:1;min-width:0}
.t1{font-weight:800;font-size:clamp(1.5rem,6vw,2.8rem);color:#0e6b6b;line-height:1.15}
.t2{font-weight:800;font-size:clamp(1.05rem,4.2vw,1.9rem);line-height:1.3;background:linear-gradient(180deg,#d4a017,#9a6a06);-webkit-background-clip:text;background-clip:text;color:transparent}
.sup{font-size:clamp(.68rem,2.4vw,.92rem);color:#667370;margin-top:2px}
.s .hero{padding:8px 14px}.s .lg{height:clamp(35px,8vw,60px)}.s .t1{font-size:clamp(1.1rem,4vw,1.6rem)}.s .t2{font-size:clamp(.85rem,3vw,1.15rem)}.s .sup{display:none}

.home{text-align:center;padding:34px 0 8px}.s .home{display:none}
.home p{color:var(--mute);margin:0 0 18px}

.bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 8px 5px 18px;box-shadow:0 3px 18px rgba(0,0,0,.06)}
.bar:focus-within{border-color:var(--acc);box-shadow:0 4px 22px rgba(14,107,107,.2)}
#aq{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:1.08rem;padding:10px 8px;outline:none}
button{font:inherit;cursor:pointer}
#as{border:0;border-radius:99px;background:var(--acc);color:#fff;font-weight:600;padding:9px 26px; transition: 0.3s;}
#as:hover{background:#0a4d4d;}
#as:disabled{opacity:.5}

.nav{display:flex;gap:6px;justify-content:center;margin:16px 0 2px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 24px;border-radius:99px;font-weight:600}
.nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}

.msgs{display:flex;flex-direction:column;gap:12px;margin-top:14px;padding-bottom:10px}
.m{border-radius:18px;padding:15px 20px;overflow-wrap:anywhere; line-height: 1.7;}
.m.u{background:var(--acc);color:#fff;align-self:flex-start;max-width:88%; box-shadow:0 4px 10px rgba(14,107,107,.2);}
.m.a{background:var(--card);border:1px solid var(--line);align-self:stretch; box-shadow:0 4px 15px rgba(0,0,0,0.05);}
.who{font-size:.9rem;font-weight:700;color:var(--gold); margin-bottom: 8px;}
.m p{margin:.3em 0}.m ul,.m ol{margin:.3em 0;padding-inline-start:1.3em}.m h4{margin:.6em 0 .2em;color:var(--acc)}

.qs{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.qchip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 15px;border-radius:99px;font-size:.9rem;text-align:right; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
.qchip:hover{border-color:var(--acc);background:var(--soft); color: var(--acc);}

.ib{position:sticky;bottom:0;background:var(--bg);padding:15px 0 10px; z-index: 10;}
.tools{text-align:center;margin-top:10px}.tools button{border:0;background:none;color:var(--mute);font-size:.85rem; font-weight: 600;}
.tools button:hover{color:var(--acc);}

.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:30px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 10px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.04)}
.facts b{display:block;font-size:1.8rem;color:var(--acc);line-height:1.2; font-weight: 800;}.facts span{font-size:.9rem;color:var(--mute); font-weight: 600;}

@media(max-width:520px){.facts{grid-template-columns:repeat(2,1fr)}}
.spinner { animation: spin 1s linear infinite; display: inline-block;}
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- خلفية الدودلز الموزعة على كامل الشاشة بحجم صغير -->
<div id="bg-doodles">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="d-pencil" viewBox="0 0 48 48"><path d="M8 40l2-8L32 10l6 6L16 38z M28 14l6 6 M8 40l8-2"/></symbol>
    <symbol id="d-book" viewBox="0 0 48 48"><path d="M6 10h14a4 4 0 014 4v24a3 3 0 00-3-3H6z M42 10H28a4 4 0 00-4 4v24a3 3 0 013-3h15z"/></symbol>
    <symbol id="d-cap" viewBox="0 0 48 48"><path d="M2 18L24 8l22 10-22 10z M12 23v10c0 3 6 6 12 6s12-3 12-6V23 M46 18v12"/></symbol>
    <symbol id="d-bulb" viewBox="0 0 48 48"><path d="M24 6a12 12 0 00-6 22v5h12v-5a12 12 0 00-6-22z M19 38h10 M20 43h8"/></symbol>
    <symbol id="d-atom" viewBox="0 0 48 48"><ellipse cx="24" cy="24" rx="20" ry="8"/><ellipse cx="24" cy="24" rx="20" ry="8" transform="rotate(60 24 24)"/><ellipse cx="24" cy="24" rx="20" ry="8" transform="rotate(120 24 24)"/><circle cx="24" cy="24" r="2.5"/></symbol>
    <symbol id="d-ruler" viewBox="0 0 48 48"><path d="M4 30L30 4l14 14L18 44z M14 26l4 4 M20 20l4 4 M26 14l4 4"/></symbol>
    <symbol id="d-star" viewBox="0 0 48 48"><path d="M24 5l5.5 12 13 1.5-9.7 8.8 2.7 12.9L24 33l-11.5 7.2 2.7-12.9-9.7-8.8 13-1.5z"/></symbol>
    <symbol id="d-globe" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/><path d="M6 24h36 M24 6c-8 9-8 27 0 36 M24 6c8 9 8 27 0 36"/></symbol>
    <symbol id="d-school" viewBox="0 0 48 48"><path d="M4 42h40 M8 42V20l16-10 16 10v22 M20 42V30h8v12 M24 10V4h6"/></symbol>
    <symbol id="d-calc" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3"/><rect x="15" y="9" width="18" height="8"/><path d="M16 24h2M23 24h2M30 24h2M16 31h2M23 31h2M30 31h2M16 38h2M23 38h2M30 38h2"/></symbol>
    <symbol id="d-palm" viewBox="0 44V22 M24 22c-4-8-12-8-16-6 M24 22c4-8 12-8 16-6 M24 22c-2-9-8-13-14-12 M24 22c2-9 8-13 14-12 M24 22V8"/></symbol>
    <symbol id="d-flask" viewBox="0 0 48 48"><path d="M18 4h12 M20 4v14L8 40a3 3 0 003 4h26a3 3 0 003-4L28 18V4 M14 32h20"/></symbol>
  </defs></svg>
  <!-- توزيع عشوائي مريح في كامل الشاشة بأحجام صغيرة (20px - 30px) -->
  <svg class="dd" style="--x:8%;--y:12%;--s:28px;--r:-15deg;--c:var(--acc);--d:0s"><use href="#d-pencil"/></svg>
  <svg class="dd" style="--x:85%;--y:18%;--s:30px;--r:10deg;--c:var(--gold);--d:-1s"><use href="#d-book"/></svg>
  <svg class="dd" style="--x:15%;--y:45%;--s:32px;--r:8deg;--c:var(--acc);--d:-2s"><use href="#d-cap"/></svg>
  <svg class="dd" style="--x:88%;--y:55%;--s:25px;--r:12deg;--c:var(--gold);--d:-0.5s"><use href="#d-bulb"/></svg>
  <svg class="dd" style="--x:10%;--y:80%;--s:28px;--r:-10deg;--c:var(--gold);--d:-3s"><use href="#d-atom"/></svg>
  <svg class="dd" style="--x:75%;--y:85%;--s:26px;--r:24deg;--c:var(--acc);--d:-1.5s"><use href="#d-ruler"/></svg>
  <svg class="dd" style="--x:45%;--y:20%;--s:22px;--r:15deg;--c:var(--gold);--d:-2.5s"><use href="#d-star"/></svg>
  <svg class="dd" style="--x:55%;--y:75%;--s:30px;--r:0deg;--c:var(--acc);--d:-0.8s"><use href="#d-globe"/></svg>
  <svg class="dd" style="--x:35%;--y:88%;--s:28px;--r:0deg;--c:var(--gold);--d:-2s"><use href="#d-school"/></svg>
  <svg class="dd" style="--x:25%;--y:25%;--s:24px;--r:-14deg;--c:var(--acc);--d:-3.2s"><use href="#d-calc"/></svg>
  <svg class="dd" style="--x:70%;--y:35%;--s:30px;--r:6deg;--c:var(--acc);--d:-1.2s"><use href="#d-palm"/></svg>
  <svg class="dd" style="--x:60%;--y:10%;--s:25px;--r:16deg;--c:var(--gold);--d:-2.2s"><use href="#d-flask"/></svg>
</div>

<div class="wrap" id="app">
  <header class="hero">
    <!-- صورة وزارة التربية والتعليم -->
    <img class="lg" src="image_f93b2f.png" alt="وزارة التعليم">
    
    <div class="mid">
      <div class="t1">باحث حذيفة بن محصن</div>
      <div class="t2">محرك بحث المدرسة</div>
      <div class="sup">
        <div>مدرسة حذيفة بن محصن للتعليم الأساسي (5-12)</div>
        <div>تحت إشراف د. بدر بن عبد الله الكعبي</div>
      </div>
    </div>

    <!-- صورة رؤية عمان -->
    <img class="lg" src="image_f93b4d.png" alt="رؤية عُمان 2040">
  </header>

  <nav class="nav" id="nav">
      <button class="on" data-m="ask"><i class="fa-solid fa-robot"></i> اسأل الباحث</button>
  </nav>

  <section class="home">
    <div class="facts">
      <div><b>139</b><span>طالباً</span></div>
      <div><b>19</b><span>معلماً</span></div>
      <div><b>5–12</b><span>الصفوف</span></div>
      <div><b>7125</b><span>رمز المدرسة</span></div>
    </div>
  </section>

  <section id="pa">
    <div class="msgs" id="msgs"></div>
    <div class="ib">
      <div class="bar">
        <input id="aq" placeholder="اسأل عن نسب أو أسماء أو أي تفصيلة في التقرير…" autocomplete="off" enterkeyhint="send">
        <button id="as" onclick="ask()">إرسال</button>
      </div>
      <div class="tools">
        <button id="ar" onclick="resetChat()">محادثة جديدة ↺</button>
      </div>
    </div>
  </section>
</div>

<script>
    const EX = ['مين مدرس الأحياء؟', 'كم عدد الطلاب؟', 'ما هي نسبة النجاح في الإنجليزي عاشر؟', 'ما هي مشروعات المدرسة؟'];
    let busy = false;

    function addMsg(type, htmlContent) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'm ' + type;
        msgDiv.innerHTML = htmlContent;
        document.getElementById('msgs').appendChild(msgDiv);
        msgDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return msgDiv;
    }

    function resetChat() {
        document.getElementById('msgs').innerHTML = '';
        addMsg('a', `<div class="who">✨ باحث حذيفة</div><p>أهلاً بك! أنا المساعد الذكي لمدرسة حذيفة بن محصن. اسألني أي سؤال عن تقرير التقويم الذاتي وسأجيبك بدقة.</p>
        <div class="qs">${EX.map(q => `<button class="qchip" onclick="document.getElementById('aq').value='${q}';ask()">${q}</button>`).join('')}</div>`);
        document.body.classList.remove('s');
        document.getElementById('aq').value = '';
    }

    document.getElementById('aq').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            ask();
        }
    });

    async function ask() {
        const input = document.getElementById('aq');
        let q = input.value.trim();
        if (!q || busy) return;

        input.value = '';
        busy = true;
        document.getElementById('as').disabled = true;
        document.body.classList.add('s'); // إخفاء الحقائق عند بدء المحادثة

        // إضافة رسالة المستخدم
        addMsg('u', q);

        // إضافة رسالة انتظار (جاري التحليل)
        const loadingMsg = addMsg('a', '<div class="who">✨ باحث حذيفة</div><p style="color:var(--mute)"><i class="fa-solid fa-circle-notch spinner"></i> جاري البحث في التقرير...</p>');

        try {
            // الاتصال بخادم OpenAI (server.js) الخاص بك
            const response = await fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q })
            });

            const data = await response.json();

            if (data.error) {
                loadingMsg.innerHTML = `<div class="who" style="color:red;">⚠ خطأ</div><p>${data.error}</p>`;
            } else {
                // تنسيق الرد (استبدال الأسطر والخط العريض)
                let formattedAnswer = data.answer.replace(/\n/g, '<br>');
                formattedAnswer = formattedAnswer.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                
                loadingMsg.innerHTML = `<div class="who">✨ باحث حذيفة</div><p>${formattedAnswer}</p>`;
            }

        } catch (error) {
            loadingMsg.innerHTML = `<div class="who" style="color:red;">⚠ خطأ في الاتصال</div><p>تعذر الاتصال بالخادم. تأكد من أن السيرفر يعمل بشكل صحيح.</p>`;
        } finally {
            busy = false;
            document.getElementById('as').disabled = false;
            input.focus();
        }
    }

    // تهيئة المحادثة عند تحميل الصفحة
    resetChat();
</script>
</body>
</html>
