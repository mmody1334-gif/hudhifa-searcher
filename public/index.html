<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد مدرسة حذيفة بن محصن</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>اسأل عن تقرير المدرسة</h1>
  <p>مدرسة حذيفة بن محصن (5-12) · تقرير التقويم الذاتي</p>
</header>

<main id="chat" aria-live="polite">
  <div class="msg bot">مرحباً، اكتب أي سؤال عن التقرير وسأجيبك من نصه مباشرة.</div>
  <div class="chips" id="chips">
    <button type="button">كم عدد الطلبة؟</button>
    <button type="button">ما نسب نجاح الصف العاشر؟</button>
    <button type="button">ما أبرز نقاط القوة؟</button>
  </div>
</main>

<div class="composer">
  <input id="q" type="text" placeholder="اكتب سؤالك هنا" maxlength="1000" autocomplete="off">
  <button id="send" type="button">إرسال</button>
</div>

<script src="app.js"></script>
</body>
</html>
