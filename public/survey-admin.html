<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>آراء أولياء الأمور | لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ea;--card:#fff;--ink:#1c2826;--mute:#667370;--acc:#0e6b6b;--gold:#b8860b;--soft:#e4f1ef;--line:#e3e0d3;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;line-height:1.8}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 50px}
h1{margin:0;color:var(--acc);font-weight:800;font-size:clamp(1.2rem,5vw,1.6rem)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border-radius:18px;padding:14px 18px;border-bottom:4px solid var(--gold);box-shadow:0 6px 24px rgba(14,107,107,.1)}
.top .sub{color:var(--mute);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
input{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;background:#fbfaf6}
input:focus{border-color:var(--acc);background:#fff}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;background:var(--acc);color:#fff;font-weight:700;padding:9px 22px}
button.ghost{background:#fff;color:var(--acc);border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:8px 0 0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
.tools input{flex:1;min-width:180px}
.stat{font-weight:800;color:var(--acc)}
.warn{background:#fff7e0;border:1px solid #f0d58a;color:#7a5a00;border-radius:12px;padding:10px 14px;margin-top:14px;font-size:.9rem}
.item{background:#fff;border:1px solid var(--line);border-right:4px solid var(--acc);border-radius:14px;padding:14px 16px;margin-top:12px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}
.meta b{color:var(--gold)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>آراء أولياء الأمور</h1>
      <div class="sub">مدرسة حذيفة بن محصن — صفحة خاصة بالإدارة</div>
    </div>
    <button class="ghost" id="logout" hidden>خروج</button>
  </div>

  <section class="card" id="login">
    <label for="pw" style="font-weight:700">كلمة مرور الإدارة</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="row"><button id="go">دخول</button></div>
    <p class="err" id="lerr"></p>
  </section>

  <section id="panel" hidden>
    <div class="tools">
      <span>عدد الآراء: <span class="stat" id="n">0</span></span>
      <input id="q" placeholder="بحث في الآراء...">
      <button class="ghost" id="reload">تحديث</button>
      <button class="ghost" id="csv">تنزيل Excel (CSV)</button>
    </div>
    <div class="warn" id="fileWarn" hidden>تنبيه: الآراء محفوظة حالياً في ملف على الخادم، وقد تُفقد عند إعادة تشغيل Render. اربط Google Sheets للحفظ الدائم.</div>
    <div id="list"></div>
  </section>
</div>

<script>
let PW = "", ALL = [];
const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/[&<>"]/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[ch]));
const fmt = d => { try { return new Date(d).toLocaleString("ar-OM", { dateStyle: "medium", timeStyle: "short" }); } catch { return d; } };

async function load() {
  const r = await fetch("/api/survey/comments", { headers: { "x-admin-password": PW } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "تعذّر التحميل.");
  ALL = data.entries || [];
  $("fileWarn").hidden = data.storage !== "file";
  draw();
}

function draw() {
  const q = $("q").value.trim();
  const items = q ? ALL.filter(e => (e.comment + " " + (e.name || "")).includes(q)) : ALL;
  $("n").textContent = ALL.length;
  $("list").innerHTML = items.length ? items.map(e => `
    <div class="item">
      <div class="meta"><b>${esc(e.name) || "ولي أمر"}</b><span>${esc(fmt(e.date))}</span></div>
      <div class="txt">${esc(e.comment)}</div>
    </div>`).join("") : `<div class="empty">${ALL.length ? "لا نتائج للبحث." : "لا توجد آراء بعد."}</div>`;
}

async function login() {
  PW = $("pw").value; $("lerr").textContent = "";
  try {
    await load();
    try { sessionStorage.setItem("svpw", PW); } catch {}
    $("login").hidden = true; $("panel").hidden = false; $("logout").hidden = false;
  } catch (ex) { $("lerr").textContent = ex.message; }
}

$("go").onclick = login;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("q").oninput = draw;
$("reload").onclick = () => load().catch(ex => alert(ex.message));
$("logout").onclick = () => { try { sessionStorage.removeItem("svpw"); } catch {} location.reload(); };
$("csv").onclick = () => {
  const q = v => '"' + String(v || "").replace(/"/g, '""') + '"';
  const rows = [["التاريخ", "الاسم", "الرأي"], ...ALL.map(e => [fmt(e.date), e.name, e.comment])];
  const blob = new Blob(["﻿" + rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "آراء-أولياء-الأمور.csv"; a.click();
};

try { const s = sessionStorage.getItem("svpw"); if (s) { $("pw").value = s; login(); } } catch {}
</script>
</body>
</html>
